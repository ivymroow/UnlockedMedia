<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>web-streaming</title>
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/player.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='12' fill='%236c5ce7'/%3E%3Ctext x='50' y='70' text-anchor='middle' font-family='monospace' font-weight='900' font-size='44' fill='%23000'%3EWS%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div id="app">
    <header id="mainHeader">
      <div class="header-left">
        <a href="#" class="logo" onclick="navigate('home');return false">web-streaming</a>
      </div>
      <div class="header-center">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input type="text" id="searchInput" placeholder="Search movies & shows..." autocomplete="off">
        </div>
      </div>
      <div class="header-right">
        <div id="userSection"></div>
        <button class="btn-icon" onclick="toggleSettings()" title="Settings">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
        </button>
      </div>
    </header>

    <main id="main">
      <div class="loading-screen" id="loadingScreen">
        <div class="spinner"></div>
        <p>Loading...</p>
      </div>
    </main>

    <div id="settings-modal" class="modal" style="display:none">
      <div class="modal-backdrop" onclick="toggleSettings()"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2>Settings</h2>
          <button class="btn-icon" onclick="toggleSettings()">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <div id="settingsAccount"></div>
          <label>Backend URL</label>
          <div class="input-group">
            <input type="text" id="settingsBackendInput" placeholder="https://your-app.onrender.com">
            <button onclick="saveSettingsBackend()">Save</button>
          </div>
          <p class="hint" style="margin-top:8px">No account needed to browse. Sign in to save progress.</p>
        </div>
      </div>
    </div>

    <div id="auth-modal" class="modal" style="display:none">
      <div class="modal-backdrop" onclick="hideAuth()"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="authModalTitle">Sign In</h2>
          <button class="btn-icon" onclick="hideAuth()">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <label>Username</label>
          <input type="text" id="authUsername" class="modal-input" placeholder="Your username" autocomplete="off">
          <label>Password</label>
          <input type="password" id="authPassword" class="modal-input" placeholder="Password" autocomplete="off">
          <div id="emailField" style="display:none">
            <label>Email <span style="color:var(--text-muted);font-weight:400">(optional)</span></label>
            <input type="email" id="authEmail" class="modal-input" placeholder="you@email.com">
          </div>
          <p style="color:#f87171;font-size:13px" id="authError"></p>
          <p class="hint">You cannot reset your password. Do not forget it.</p>
          <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:12px" onclick="doAuth()">Continue</button>
          <p style="text-align:center;margin-top:12px;font-size:13px;color:var(--text-muted)" id="authToggle">Don't have an account? <a href="#" onclick="toggleAuthMode();return false" style="color:var(--primary)">Sign Up</a></p>
        </div>
      </div>
    </div>
  </div>

  <script disable-devtool-auto src="https://cdn.jsdelivr.net/npm/disable-devtool"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
